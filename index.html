<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<title>重慶 6 日遊 · 2026.10.9 – 10.14</title>
<style>
:root{
  --paper:#f6f1e7;
  --paper-2:#fdfaf3;
  --ink:#2b2620;
  --ink-soft:#6f6558;
  --vermilion:#c0392b;
  --vermilion-deep:#96271b;
  --gold:#c08a2d;
  --line:#e4dbc9;
  --card:#fffdf8;
  --shadow:0 6px 24px rgba(60,40,20,.10);
  --radius:18px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  background:var(--paper);
  background-image:radial-gradient(circle at 20% 0%,rgba(192,57,43,.05),transparent 45%),radial-gradient(circle at 100% 30%,rgba(192,138,45,.06),transparent 40%);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","PingFang HK","Microsoft JhengHei","Noto Sans TC",sans-serif;
  line-height:1.7;
  padding-bottom:64px;
}
.serif{font-family:"Noto Serif TC","Songti TC","PMingLiU","SimSun",serif}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}

/* ---------- Hero ---------- */
.hero{position:relative;height:min(62vw,420px);min-height:280px;overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,10,5,.25) 0%,rgba(20,10,5,0) 35%,rgba(20,10,5,.72) 100%)}
.hero-text{position:absolute;left:0;right:0;bottom:0;padding:24px 20px 20px;color:#fff;z-index:2}
.hero-kicker{font-size:12px;letter-spacing:.35em;color:#f3d9a4;text-transform:uppercase;margin-bottom:6px}
.hero h1{font-size:clamp(30px,8vw,44px);line-height:1.2;text-shadow:0 2px 12px rgba(0,0,0,.4)}
.hero-sub{font-size:14px;color:#f0e6d6;margin-top:6px}
.hero-badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.hero-badges span{font-size:12px;background:rgba(255,255,255,.16);backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.28);padding:3px 10px;border-radius:999px}

/* ---------- Flight strip ---------- */
.flight-strip{background:var(--ink);color:#f3ead9;font-size:13px}
.flight-strip .wrap{display:flex;gap:14px;align-items:center;padding-top:10px;padding-bottom:10px;overflow-x:auto;white-space:nowrap}
.flight-strip b{color:#f3d9a4;font-weight:600}

/* ---------- Day tabs ---------- */
.daybar{position:sticky;top:0;z-index:20;background:rgba(246,241,231,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.daybar .wrap{display:flex;gap:8px;overflow-x:auto;padding-top:10px;padding-bottom:10px;scrollbar-width:none}
.daybar .wrap::-webkit-scrollbar{display:none}
.daytab{flex:0 0 auto;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:8px 14px;cursor:pointer;text-align:center;transition:all .25s;min-width:76px}
.daytab .d{font-weight:700;font-size:14px}
.daytab .t{font-size:11px;color:var(--ink-soft);margin-top:1px}
.daytab.active{background:var(--vermilion);border-color:var(--vermilion);color:#fff;box-shadow:0 4px 14px rgba(192,57,43,.35)}
.daytab.active .t{color:#ffd9c9}

/* ---------- Day header ---------- */
.dayhead{padding:28px 0 6px}
.dayhead .date{font-size:13px;color:var(--gold);letter-spacing:.15em;font-weight:600}
.dayhead h2{font-size:clamp(22px,6vw,30px);margin-top:4px}
.dayhead p{color:var(--ink-soft);font-size:14px;margin-top:6px}

/* ---------- Timeline ---------- */
.timeline{position:relative;margin-top:18px;padding-left:26px}
.timeline::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--gold),var(--vermilion));border-radius:2px;opacity:.5}
.slot{position:relative;margin-bottom:22px}
.slot::before{content:"";position:absolute;left:-25px;top:8px;width:12px;height:12px;border-radius:50%;background:var(--paper);border:3px solid var(--vermilion)}
.slot-time{font-size:13px;font-weight:700;color:var(--vermilion);letter-spacing:.05em}
.slot-title{font-size:16px;font-weight:700;margin:2px 0 4px}
.slot-note{font-size:13.5px;color:var(--ink-soft)}
.slot-note em{font-style:normal;color:var(--gold);font-weight:600}

/* ---------- Spot card ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);margin-top:10px}
.card-img{position:relative;aspect-ratio:16/9;background:linear-gradient(135deg,#3a2c22,#7a3b2a);overflow:hidden}
.card-img img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s}
.card:active .card-img img{transform:scale(1.04)}
.card-img .fallback{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:40px;color:#f3d9a4}
.card-img.img-failed img{display:none}
.card-img.img-failed .fallback{display:flex}
.card-tag{position:absolute;left:12px;top:12px;background:rgba(20,12,6,.55);backdrop-filter:blur(4px);color:#ffe9c9;font-size:11.5px;padding:3px 10px;border-radius:999px;border:1px solid rgba(255,233,201,.35)}
.card-body{padding:14px 16px 12px}
.card-name{font-size:17px;font-weight:700;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.card-name small{font-size:12.5px;color:var(--ink-soft);font-weight:400}
.card-intro{font-size:13.5px;color:var(--ink-soft);margin-top:4px}
.card-toggle{margin-top:8px;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--vermilion);background:none;border:none;cursor:pointer;padding:4px 0}
.card-toggle .arrow{display:inline-block;transition:transform .3s}
.card.open .card-toggle .arrow{transform:rotate(180deg)}
.card-detail{max-height:0;overflow:hidden;transition:max-height .45s ease}
.card.open .card-detail{max-height:420px}
.detail-inner{border-top:1px dashed var(--line);margin-top:8px;padding-top:10px;display:grid;gap:8px}
.drow{display:flex;gap:10px;font-size:13px}
.drow .k{flex:0 0 62px;color:var(--gold);font-weight:700}
.drow .v{color:var(--ink)}
.drow.tip .v{background:#fdf3e4;border-radius:10px;padding:6px 10px;flex:1}

/* ---------- Meal / transport mini ---------- */
.mini{display:flex;gap:10px;align-items:flex-start;background:rgba(255,253,248,.7);border:1px dashed var(--line);border-radius:14px;padding:10px 14px;margin-top:10px;font-size:13.5px;color:var(--ink-soft)}
.mini .ic{font-size:18px;line-height:1.4}
.mini b{color:var(--ink)}

/* ---------- Footer ---------- */
footer{margin-top:40px;padding:24px 0 8px;border-top:1px solid var(--line);text-align:center;font-size:12px;color:var(--ink-soft)}
footer .seal{font-size:22px;letter-spacing:.4em;color:var(--vermilion);margin-bottom:8px}

@media (min-width:640px){
  .card-detail{transition:max-height .45s ease}
}
</style>
</head>

function cardHTML(id){
  var s = SPOTS[id];
  return '<div class="card" data-card>'+
    '<div class="card-img"><img loading="lazy" src="'+s.img+'" alt="'+s.alt+'" onerror="this.closest(\'.card-img\').classList.add(\'img-failed\')"><div class="fallback">🏞</div><span class="card-tag">'+s.tag+'</span></div>'+
    '<div class="card-body">'+
      '<div class="card-name serif">'+s.name+' <small>'+s.sub+'</small></div>'+
      '<div class="card-intro">'+s.intro+'</div>'+
      '<button class="card-toggle" type="button">開放時間 · 門票 · 貼士 <span class="arrow">▾</span></button>'+
      '<div class="card-detail"><div class="detail-inner">'+
        '<div class="drow"><span class="k">🕐 時間</span><span class="v">'+s.hours+'</span></div>'+
        '<div class="drow"><span class="k">🎫 門票</span><span class="v">'+s.ticket+'</span></div>'+
        '<div class="drow tip"><span class="k">💡 貼士</span><span class="v">'+s.tip+'</span></div>'+
      '</div></div>'+
    '</div>'+
  '</div>';
}

function renderDay(day){
  var html = '<section class="dayhead"><div class="date">DAY '+day.id+' · 10 月 '+day.date.split(".")[1]+' 日 '+day.week+'</div>'+
    '<h2 class="serif">'+day.title+'</h2><p>'+day.desc+'</p></section><div class="timeline">';
  day.slots.forEach(function(slot){
    html += '<div class="slot"><div class="slot-time">'+slot.time+'</div><div class="slot-title">'+slot.title+'</div>';
    if(slot.note) html += '<div class="slot-note">'+slot.note+'</div>';
    if(slot.cards) slot.cards.forEach(function(id){ html += cardHTML(id); });
    if(slot.minis) slot.minis.forEach(function(m){ html += '<div class="mini"><span class="ic">'+m.ic+'</span><span>'+m.html+'</span></div>'; });
    html += '</div>';
  });
  html += '</div>';
  return html;
}

var tabsEl = document.getElementById('dayTabs');
var contentEl = document.getElementById('dayContent');
var currentDay = 1;

DAYS.forEach(function(d){
  var b = document.createElement('button');
  b.className = 'daytab' + (d.id===1 ? ' active' : '');
  b.type = 'button';
  b.innerHTML = '<div class="d">D'+d.id+' · '+d.date+'</div><div class="t">'+d.week+'</div>';
  b.addEventListener('click', function(){
    currentDay = d.id;
    tabsEl.querySelectorAll('.daytab').forEach(function(t){ t.classList.remove('active'); });
    b.classList.add('active');
    b.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
    contentEl.style.opacity = 0;
    setTimeout(function(){
      contentEl.innerHTML = renderDay(d);
      contentEl.style.transition = 'opacity .3s';
      contentEl.style.opacity = 1;
      window.scrollTo({top: document.querySelector('.daybar').offsetTop - 1, behavior:'smooth'});
    }, 160);
  });
  tabsEl.appendChild(b);
});

contentEl.innerHTML = renderDay(DAYS[0]);

contentEl.addEventListener('click', function(e){
  var btn = e.target.closest('.card-toggle');
  if(!btn) return;
  var card = btn.closest('[data-card]');
  card.classList.toggle('open');
  btn.childNodes[0].nodeValue = card.classList.contains('open') ? '收合詳情 ' : '開放時間 · 門票 · 貼士 ';
});
</script>
